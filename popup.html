<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>WebAutomations</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      background: #0b0f19;
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #1e293b;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      font-size: 10px;
      background: #6366f1;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 240px;
      overflow-y: auto;
      margin-bottom: 16px;
    }
    .item {
      background: #172033;
      border: 1px solid #243049;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .item:hover {
      border-color: #3b82f6;
      background: #1a253c;
    }
    .flow-link:hover .flow-title {
      color: #93c5fd !important;
    }
    .btn {
      width: 100%;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      border: none;
      color: white;
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.15s ease;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .btn-run {
      background: #10b981;
      border: none;
      color: white;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title" style="display:flex;align-items:center;gap:6px;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" color="#6366f1"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      <span>WebAutomations</span>
      <span class="badge">v1.0</span>
    </div>
  </div>

  <div class="list" id="automationsList">
    <div style="font-size: 11px; color: #64748b; text-align: center; padding: 10px 0;">
      Nenhuma automação salva no storage.
    </div>
  </div>

  <div style="margin-bottom: 14px; padding: 10px; background: #172033; border: 1px solid #243049; border-radius: 8px;">
    <div style="display: flex; align-items: center; justify-content: space-between; font-size: 12px; margin-bottom: 6px;">
      <span style="font-weight: 600; display: inline-flex; align-items: center; gap: 5px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" y1="16" x2="8" y2="16"/><line x1="16" y1="16" x2="16" y2="16"/></svg>
        Ponte MCP (LLM)
      </span>
      <label style="display: inline-flex; align-items: center; cursor: pointer;">
        <input type="checkbox" id="mcpToggle" style="cursor: pointer;" />
      </label>
    </div>
    <div id="mcpStatusText" style="font-size: 10px; color: #64748b;">Desativada (Clique para conectar)</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <button class="btn" id="btnOpenStudio">Abrir Visual Flow Studio</button>
    <div style="display: flex; gap: 6px;">
      <button class="btn btn-secondary" id="btnOpenHtmlAnalyzer" style="flex: 1; padding: 8px 4px; font-size: 11px; display: flex; align-items: center; justify-content: center; gap: 4px; background: #172033; border: 1px solid #243049; border-radius: 6px; color: #cbd5e1; cursor: pointer; transition: all 0.15s ease;" title="Analisador de Elementos HTML">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="22" y1="12" x2="18" y2="12"></line><line x1="6" y1="12" x2="2" y2="12"></line><line x1="12" y1="6" x2="12" y2="2"></line><line x1="12" y1="22" x2="12" y2="18"></line><circle cx="12" cy="12" r="3"></circle></svg>
        Analisador
      </button>
      <button class="btn btn-secondary" id="btnOpenSettingsPopup" style="flex: 1; padding: 8px 4px; font-size: 11px; display: flex; align-items: center; justify-content: center; gap: 4px; background: #172033; border: 1px solid #243049; border-radius: 6px; color: #cbd5e1; cursor: pointer; transition: all 0.15s ease;" title="Configurações">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        Ajustes
      </button>
    </div>
  </div>

  <script type="module" src="dist/popup.js"></script>
</body>
</html>
